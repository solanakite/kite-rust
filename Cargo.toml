[package]
name = "solana-kite"
version = "0.6.1"
edition = "2021"
authors = ["Mike MacCana <mike.maccana@gmail.com>"]
description = "High level client-side tools for testing your Solana programs"
license = "MIT"
repository = "https://github.com/solanakite/kite-rust"
homepage = "https://github.com/solanakite/kite-rust"
documentation = "https://docs.rs/solana-kite"
readme = "README.md"
keywords = ["solana", "blockchain", "testing", "client", "utilities"]
categories = [
    "development-tools::testing",
    "api-bindings",
    "cryptography::cryptocurrencies",
]
exclude = ["target/", "test-ledger/", ".DS_Store", ".claude/"]

[dependencies]
litesvm = "0.16.0"
solana-account = "4.3.0"
# Agave's MAX_LOADED_ACCOUNTS_DATA_SIZE_BYTES, the loaded account data limit
# kite sets, and MAX_COMPUTE_UNIT_LIMIT, the compute unit limit kite simulates
# a transaction with when no compute unit limit is passed. Same version litesvm
# 0.16 uses.
solana-compute-budget = "4.2"
solana-instruction = ">=3.2, <4"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-program = "3.0.0"
solana-pubkey = "3.0.0"
solana-signer = "3.0.0"
# The ComputeBudget program ID, to reject ComputeBudget instructions, which do
# nothing in a v1 transaction. Same version litesvm 0.16 uses.
solana-sdk-ids = "3.1"
solana-transaction = "4.1.5"

# kite calls these crates' instruction builders; the token programs themselves run
# inside LiteSVM. Without `no-entrypoint` each defines an `entrypoint` symbol, which
# clashes with the program under test's when a test binary links both.
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
# PACKET_DATA_SIZE, the 1,232-byte legacy transaction size limit, and wincode,
# the serializer solana-transaction uses, so the tests can measure a
# transaction against that limit.
solana-packet = "4.1"
wincode = "0.5"
# System Program transfer instructions for the tests. 3.2 is the version
# litesvm 0.16 already uses; transfer() needs the bincode feature.
solana-system-interface = { version = "3.2", features = ["bincode"] }
# A ComputeBudget instruction for the test that kite rejects one. Same version
# litesvm 0.16 uses.
solana-compute-budget-interface = "3.0"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "token_operations"
path = "examples/token_operations.rs"

[[example]]
name = "token_extensions_operations"
path = "examples/token_extensions_operations.rs"

[[example]]
name = "transfer_hook_operations"
path = "examples/transfer_hook_operations.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
